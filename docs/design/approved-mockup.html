    if(target.dataset.confirmclaim!==undefined){users.find(u=>u.id===state.user).claims.splice(Number(target.dataset.confirmclaim),1);dialog.close();render();notify('Claim removed in this preview.');return;}
    if(target.dataset.action==='delete-user'){const u=users.find(u=>u.id===state.user);openDialog(`<h2 id="ais-dialog-title">Delete ${fullname(u)}?</h2><p>This removes the account and revokes its tokens. This preview only changes fictional data.</p><div class="ais-inline" style="justify-content:flex-end">${button('Cancel','data-close')}${button('Delete account','data-confirmdelete',true)}</div>`);return;}
    if(target.hasAttribute('data-confirmdelete')){users.splice(users.findIndex(u=>u.id===state.user),1);state.user=users[0]?.id;dialog.close();navigate('users');notify('User deleted in this preview.');}
  });
  root.addEventListener('input',event=>{if(event.target.id==='ais-search'){state.query=event.target.value;filterUsers();}if(event.target.form?.elements.confirm)event.target.form.elements.confirm.setCustomValidity('');});
  root.addEventListener('change',event=>{if(event.target===picker)navigate(picker.value);if(event.target.id==='ais-filter'){state.filter=event.target.value;filterUsers();}});
  root.addEventListener('submit',event=>{event.preventDefault();handleForm(event.target);});
  root.addEventListener('keydown',event=>{if(event.key==='Enter'&&event.target.tagName==='INPUT'&&event.target.form){event.preventDefault();if(event.target.form.reportValidity())handleForm(event.target.form);}});
  function handleForm(form){
    const kind=form.dataset.form;if(!kind)return;const values=Object.fromEntries(new FormData(form));
    if(form.elements.confirm&&values.password!==values.confirm){form.elements.confirm.setCustomValidity('The passwords do not match.');form.elements.confirm.reportValidity();return;}
    if(kind==='login'){if(state.context==='oidc'){form.reset();notify(`Sign-in preview complete. The real flow would now return to ${design.app}.`);}else{navigate('dashboard');notify('Signed in to the fictional admin preview.');}}
    if(kind==='register'||kind==='forgot'){state.emailKind=kind==='forgot'?'reset':'register';navigate('email');}
    if(kind==='reset'){navigate(state.context==='oidc'?'oidc':'login');notify('Password reset preview complete. You can now sign in.');}
    if(kind==='profile'){notify('Profile changes saved in this preview.');}
    if(kind==='edit'){const u=users.find(u=>u.id===state.user);Object.assign(u,{first:values.first.trim(),last:values.last.trim(),screen:values.screen.trim()||values.first+' '+values.last,confirmed:values.confirmed==='on'});navigate('detail');notify('User changes saved in this preview.');}
    if(kind==='add'){if(users.some(u=>u.email.toLowerCase()===values.email.toLowerCase())){form.elements.email.setCustomValidity('This email already exists in the preview.');form.elements.email.reportValidity();form.elements.email.addEventListener('input',()=>form.elements.email.setCustomValidity(''),{once:true});return;}const u={id:'usr_'+Date.now(),first:values.first.trim(),last:values.last.trim(),email:values.email,screen:values.screen||values.first+' '+values.last,confirmed:true,joined:'Nov 11, 2026',recent:true,claims:[]};users.unshift(u);state.query='';state.filter='all';navigate('detail',u.id);notify('User created in this preview.');}
    if(kind==='claim'){users.find(u=>u.id===state.user).claims.push([values.type.trim(),values.value.trim()]);dialog.close();state.tab='claims';render();notify('Claim added in this preview.');}
  }
  window.addEventListener('openai:set_globals',event=>{const next=event.detail?.globals?.widgetState?.privateContent;if(next?.version===2&&screenNames[next.page]){state.page=next.page;state.context=next.context==='oidc'?'oidc':'direct';if(users.some(u=>u.id===next.user))state.user=next.user;if(next.design)Object.assign(design,next.design);render();}});
  render();
  if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:()=>{render();persist();}});tweak.addSelect(design,'app',{label:'Example OIDC application',options:['Campus Portal','Course Manager','Team Workspace']});tweak.addSelect(design,'accent',{label:'Accent',options:['Blue','Teal']});tweak.addSelect(design,'density',{label:'Admin table density',options:['Comfortable','Compact']});}
})();
</script>
