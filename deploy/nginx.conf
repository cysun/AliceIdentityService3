# Include from nginx's http context. Replace the hostname and TLS certificate paths.
# No query strings, request paths, headers or bodies in access logs.
log_format ais3_safe '$time_iso8601 $request_method $status $request_time';

server {
    listen 80;
    server_name ais3-stage.example.org;
    access_log /var/log/nginx/ais3-access.log ais3_safe;
    error_log /var/log/nginx/ais3-error.log crit;
    return 308 https://ais3-stage.example.org$request_uri;
}

server {
    listen 443 ssl;
    server_name ais3-stage.example.org;
    ssl_certificate /etc/letsencrypt/live/ais3-stage.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ais3-stage.example.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    access_log /var/log/nginx/ais3-access.log ais3_safe;
    # Ordinary proxy errors can include the original URI (and account/OIDC tokens).
    error_log /var/log/nginx/ais3-error.log crit;
    client_max_body_size 64k;

    # Health probes are local to the host, not a public database status endpoint.
    location /health { return 404; }

    # Proxy all assets too: AIS3 must authorize /admin/ before serving static files.
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
